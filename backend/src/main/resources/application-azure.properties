# Activar con SPRING_PROFILES_ACTIVE=azure
# No subir datos sensibles: el entorno inyecta estas variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema se crea con database/schema-mysql.sql (no con Hibernate en Azure).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5

# No recrear datos de ejemplo en un despliegue público por defecto.
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:false}
server.error.include-message=never
