# Perfil de despliegue Railway: SPRING_PROFILES_ACTIVE=railway
# Variables DB_URL, DB_USER y DB_PASSWORD se definen en el servicio Backend.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Crear el esquema de demo en la base provisionada por Railway, sin borrados.
# CREATE TABLE IF NOT EXISTS no realiza futuras migraciones: usar Flyway/Liquibase en produccion.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-railway.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=30000

# Desactivado por defecto para no crear datos de prueba publicos.
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:false}
server.error.include-message=never
